services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matriz}
      POSTGRES_USER: ${POSTGRES_USER:-matriz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - matriz_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-matriz}
      DATABASE_USERNAME: ${POSTGRES_USER:-matriz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  matriz_data:
