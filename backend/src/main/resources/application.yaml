spring:
  application:
    name: matriz
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/matriz}
    username: ${DATABASE_USERNAME:matriz}
    password: ${DATABASE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
matriz:
  demo:
    enabled: ${DEMO_ENABLED:false}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/matriz}
    public-realm-uri: ${KEYCLOAK_PUBLIC_REALM_URI:http://localhost:8180/realms/matriz}
    backchannel-realm-uri: ${KEYCLOAK_BACKCHANNEL_REALM_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/matriz}}
    client-id: ${KEYCLOAK_CLIENT_ID:matriz-web}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:matriz-local-client-secret}
